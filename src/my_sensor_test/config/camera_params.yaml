# ============================================================
# Cấu hình kiểm thử Camera (USB Camera / Webcam)
# ============================================================
camera_node:
  ros__parameters:
    video_device: "/dev/video0"
    image_size: [1920, 1080]
    camera_frame_id: "camera_link"
    pixel_format: "YUYV"         # Hoặc "MJPG"
    time_per_frame: [1, 60]      # 60 FPS
    auto_white_balance: true
    auto_exposure: true
