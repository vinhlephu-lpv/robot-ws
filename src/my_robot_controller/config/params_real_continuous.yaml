# ============================================================
# Tham số cho XE THẬT — CHẾ ĐỘ ĐÁNH LÁI LIÊN TỤC (CONTINUOUS STEER)
# Vừa chạy vừa đánh lái trong luống bắp, không dừng xoay tại chỗ
# Dùng với: ros2 launch my_robot_bringup real_robot_continuous.launch.py
# ============================================================

cnn_driver_node:
  ros__parameters:
    # ── Chế độ điều hướng bám luống ─────────────────────────────
    tracking_steer_mode: 'CONTINUOUS_STEER' # Bật chế độ vừa chạy vừa đánh lái
    steer_trigger_deg: 2.2        # độ — Ngưỡng kích hoạt bẻ lái (|góc| > 2.2°)
    steer_resume_deg: 1.2         # độ — Ngưỡng xác nhận thẳng hàng (|góc| < 1.2°)
    steer_aligned_frames: 4       # frames — Số frame liên tiếp < 1.2° để xác nhận thẳng
    steer_boost_speed: 0.095      # m/s — Vận tốc bánh ngoài khi bẻ lái (đủ lực bẻ lái dứt khoát)
    steer_brake_speed: 0.025      # m/s — Vận tốc bánh trong khi bẻ lái (lăn chậm duy trì bám đường, không dừng khựng)
    steer_ramp_time: 0.40         # s — Thời gian tăng/giảm tốc mềm chống giật, chống trượt bánh

    # Đường dẫn model ONNX INT8
    model_path: 'models/crop_row_cnn_best_final_int8.onnx'
    input_height: 384
    input_width: 384
    save_debug_imgs: false

    # Cấu hình Topics đồng bộ cảm biến trên xe thật
    image_topic: '/camera/color/image_raw'
    odom_topic: '/odometry/filtered'
    imu_topic: '/imu/data'

    # Không sử dụng mặt nạ HSV trên xe thật (dùng model ONNX)
    use_hsv_mask: false

    mask_threshold: 0.35        # cao hơn sim vì model nhận diện ảnh thật tốt hơn
    roi_ratio: 0.80             # Vùng quan tâm (ROI) 80% chiều cao ảnh tính từ cận cảnh đáy lên

    # Tốc độ di chuyển danh định khi đi thẳng (0.075 m/s)
    linear_speed: 0.075
    turn_linear_speed: 0.075    # tốc độ chạy ngang khi U-Turn (giữ chậm an toàn)
    turn_angular_speed: 0.38    # rad/s — Vận tốc góc khi U-Turn / xoay đủ lực thắng cỏ
    turn_in_place_threshold_deg: 2.2
    turn_in_place_resume_deg: 1.2
    heading_adjust_aligned_frames: 10
    camera_trim_deg: 0.0

    # Bộ điều khiển trượt SMC
    lambda_smc: 2.5
    k_smc: 4.2
    eta_smc: 0.8
    phi_smc: 0.4

    kp: 1.5
    max_steering_angle_deg: 14.0
    # Khoảng cách giữa 2 hàng luống thực tế (m): Luống 2 bên phải Luống 1 khoảng 1.0m - 1.2m
    row_spacing: 1.10
    min_row_length: 1.0

    # Ngưỡng confidence
    low_confidence_threshold: 0.30
    high_confidence_threshold: 0.40  # >= 40% (0.40) là bắt luống sớm và tracking ngay

    # Tự động nhận biết hết hàng (End of Row) & Quay đầu U-Turn (Giữ nguyên 100%):
    enable_uturn: true
    uturn_mode: 'PIVOT'           # Pivot U-Turn 4 giai đoạn
    drive_out_distance: 1.20      # m — Chạy thẳng thoát khỏi miệng luống 1.0m - 1.5m (chọn 1.2m) để xác định Goal 1
    low_conf_frames_threshold: 15
    min_turn_angle_deg: 120.0     # độ — góc xoay tối thiểu (>120 độ) trước khi cho phép CNN bắt luống mới
    max_row_length: 25.0

    # ── Điều Phối Nhiệm Vụ 2 Luống Thực Nghiệm (Mission Goals) ──
    enable_mission_goals: true
    enable_global_plan_assist: true
    field_length: 15.0
    headland_area_length: 4.0
    goal_tolerance: 0.40

    # Tọa độ 4 điểm mốc nhiệm vụ: (+) = Rẽ Phải, (-) = Rẽ Trái
    goal_1_x: 15.0
    goal_1_y: 0.0
    goal_2_x: 15.0
    goal_2_y: 0.80
    goal_3_x: 0.0
    goal_3_y: 0.80

    # Tham số Quỹ Đạo Omega / Pivot Turn
    turn_side: 'RIGHT'
    omega_open_angle_deg: 35.0
    omega_r1: 0.65
    omega_clearance: 0.25
    omega_lead_in: 0.40

    warmup_time: 3.0
    drive_out_time: 2.0
    min_turn_time: 8.0

    # Tham số GPS & Geodetic Datum Origin (Tọa độ WGS-84 gốc)
    datum_latitude: 10.775667
    datum_longitude: 106.670889
    datum_altitude: 10.0
    gps_topic: '/gps/fix'

    # Cấu hình xuất Log & Chuẩn hóa Terminal
    enable_file_logging: true
    log_output_dir: 'logs'
    terminal_log_interval: 1.0

gps_driver_node:
  ros__parameters:
    serial_port: '/dev/ttyAMA0'
    baudrate: 38400
    frame_id: 'gps_link'
    publish_topic: '/gps/fix'

bts7960_driver_node:
  ros__parameters:
    wheel_base: 0.58
    max_linear_speed: 1.00      # m/s = 100% PWM
    min_duty_cycle: 22.0
    pwm_frequency: 1000

    left_rpwm_pin:  17
    left_lpwm_pin:  27
    left_en_pin:    22
    right_rpwm_pin: 23
    right_lpwm_pin: 24
    right_en_pin:   25

# Cấu hình Bản đồ Chi phí Thời gian thực (Real-time Costmap cho RViz)
costmap_node:
  ros__parameters:
    inscribed_radius: 0.35
    inflation_radius: 0.45
    cost_scaling_factor: 10.0
    obstacle_threshold: 40
    resolution: 0.05
    map_length_m: 60.0
    map_width_m: 20.0
    publish_rate: 4.0
