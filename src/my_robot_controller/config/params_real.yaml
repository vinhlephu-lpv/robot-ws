# ============================================================
# Tham số cho XE THẬT (Raspberry Pi + Camera + BTS7960)
# Dùng với: ros2 launch luanvan_control real_robot.launch.py
# ============================================================

cnn_driver_node:
  ros__parameters:
    # Đường dẫn model ONNX INT8 (24MB, tối ưu hóa suy luận tăng tốc cho Raspberry Pi)
    model_path: 'models/crop_row_cnn_best_final_int8.onnx'
    # Kích thước input mạng CNN: 384x384 (Đạt chuẩn ~2 FPS - cập nhật góc lái 2 lần mỗi giây trên Pi)
    input_height: 384
    input_width: 384
    save_debug_imgs: false

    # Cấu hình Topics đồng bộ cảm biến trên xe thật
    image_topic: '/camera/color/image_raw'
    odom_topic: '/odometry/filtered'
    imu_topic: '/imu/data'

    # Không sử dụng mặt nạ HSV trên xe thật (dùng model ONNX)
    use_hsv_mask: false

    mask_threshold: 0.35        # cao hơn sim vì model nhận diện ảnh thật tốt hơn

    # Tốc độ di chuyển (m/s) — Chạy thẳng chậm ổn định, lực quay bẻ lái êm ái chống trượt trên cỏ
    linear_speed: 0.10
    turn_linear_speed: 0.10
    turn_angular_speed: 0.85    # 0.85 rad/s: mô-men xoay 4 bánh vi sai khỏe khoắn trên cỏ/đất, không bị kẹt bánh
    turn_in_place_threshold_deg: 0.3 # Ngưỡng dừng xoay căn chỉnh hướng: lệch > 3.0° dừng tiến xoay tại chỗ, <= 3.0° chạy thẳng 0.1 m/s

    # Bộ điều khiển trượt SMC bám luống với lực bẻ lái mạnh mẽ, dứt khoát
    lambda_smc: 2.5             # hệ số bề mặt trượt S = de + lambda * e
    k_smc: 4.2                  # hệ số hồi tiếp mô-men quay dứt khoát
    eta_smc: 0.8                # hệ số chuyển mạch triệt tiêu nhanh sai số
    phi_smc: 0.4                # lớp biên chống rung chattering

    kp: 1.5                     # có thể cần giảm xuống nếu xe dao động
    max_steering_angle_deg: 14.0 # góc bẻ lái tối đa nâng lên 14.0 độ giúp xe bẻ lái dứt khoát về giữa hàng
    ema_alpha: 0.35             # tăng nhẹ độ nhạy EMA phản xạ bẻ lái

    # Khoảng cách giữa 2 hàng luống thực tế (m)
    row_spacing: 1.20           # Hàng cách hàng 0.9m
    min_row_length: 5.0         # m — cự ly tối thiểu bắt buộc chạy trong hàng trước khi cho phép nhận biết hết luống (tránh quay đầu nhầm khi còn trong hàng)

    # Ngưỡng confidence — CAO hơn sim vì ảnh thật cho mask rõ ràng hơn
    low_confidence_threshold: 0.30
    high_confidence_threshold: 0.55

    # Tự động nhận biết hết hàng (End of Row) bằng cảm biến:
    # Tạm thời vô hiệu hóa tính năng quay đầu U-Turn (false), xe chỉ tracking và tự dừng hẳn ở cuối hàng
    enable_uturn: false
    low_conf_frames_threshold: 5  # 5 frame liên tiếp thấy hết cây / confidence giảm dưới 30% để dừng xe
    max_row_length: 10.0          # m — giới hạn an toàn tối đa

    warmup_time: 3.0
    drive_out_time: 2.0
    min_turn_time: 8.0

    # Tham số GPS & Geodetic Datum Origin (Tọa độ WGS-84 gốc)
    datum_latitude: 10.775667       # độ (Latitude)
    datum_longitude: 106.670889     # độ (Longitude)
    datum_altitude: 10.0            # m (Altitude)
    gps_topic: '/gps/fix'

    # Cấu hình xuất Log & Chuẩn hóa Terminal
    enable_file_logging: true
    log_output_dir: 'logs'
    terminal_log_interval: 1.0     # s — chu kỳ in thông tin trạng thái chuẩn ra terminal

gps_driver_node:
  ros__parameters:
    serial_port: '/dev/ttyAMA0'
    baudrate: 38400
    frame_id: 'gps_link'
    publish_topic: '/gps/fix'

bts7960_driver_node:
  ros__parameters:
    wheel_base: 0.58            # m (đo thực tế khoảng cách tâm 2 bánh)
    max_linear_speed: 0.18      # m/s = 100% PWM (tăng nhẹ dải trần để mở rộng dải PWM quay xe)
    min_duty_cycle: 32.0        # % — Nâng lên 32% để motor luôn đủ momen xoắn đẩy xe vượt ma sát tĩnh trên cỏ/đất
    pwm_frequency: 1000         # Hz

    # GPIO BCM pin numbers — chỉnh theo sơ đồ nối dây thực tế
    left_rpwm_pin:  17
    left_lpwm_pin:  27
    left_en_pin:    22
    right_rpwm_pin: 23
    right_lpwm_pin: 24
    right_en_pin:   25

# Cấu hình Bản đồ Chi phí Thời gian thực (Real-time Costmap cho RViz)
costmap_node:
  ros__parameters:
    inscribed_radius: 0.35      # m — Bán kính thân xe (35cm theo kích thước thực tế)
    inflation_radius: 0.45      # m — Tổng đệm tính từ gốc cây (45cm). Với hàng cách 1.2m, chừa lối thông 30cm ở giữa
    cost_scaling_factor: 10.0   # Hệ số suy giảm dải màu chi phí (98 -> 1)
    obstacle_threshold: 40      # Ngưỡng tích lũy quét LiDAR nhận diện thân cây
    resolution: 0.05            # m — Độ phân giải ô lưới (5cm/ô)
    map_length_m: 60.0          # m — Chiều dài bao phủ dọc luống
    map_width_m: 20.0           # m — Chiều rộng bao phủ
    publish_rate: 4.0           # Hz — Tần số xuất bản mượt mà lên RViz
