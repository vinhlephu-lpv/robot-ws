slam_toolbox:
  ros__parameters:
    use_sim_time: true
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping # mapping or localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 12.0 #for rastering images
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.

    # General Parameters
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 70
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.45  
    link_scan_maximum_distance: 3.0
    loop_search_maximum_distance: 3.0
    do_loop_closing: false 
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 0.3  
    loop_match_minimum_response_coarse: 0.75    
    loop_match_minimum_response_fine: 0.85

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.40
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 0.8    

    fine_search_angle_offset: 0.0087     
    coarse_search_angle_offset: 0.174   
    coarse_angle_resolution: 0.0174        
    minimum_angle_penalty: 0.8
    minimum_distance_penalty: 0.5
    use_response_expansion: true
