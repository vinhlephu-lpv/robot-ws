# ============================================================
# SLAM Toolbox Parameters for REAL Robot (RPLIDAR C1 + ESP32 Encoder)
# ============================================================
slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # General Parameters — Real robot with ESP32 encoder odom
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 100
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.45
    link_scan_maximum_distance: 3.0
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 0.3
    loop_match_minimum_response_coarse: 0.75
    loop_match_minimum_response_fine: 0.85

    # Correlation Parameters
    correlation_search_space_dimension: 0.40
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Loop Closure Parameters
    loop_search_space_dimension: 4.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 0.8

    fine_search_angle_offset: 0.0087
    coarse_search_angle_offset: 0.174
    coarse_angle_resolution: 0.0174
    minimum_angle_penalty: 0.8
    minimum_distance_penalty: 0.5
    use_response_expansion: true
